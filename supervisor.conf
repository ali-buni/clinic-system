[program:clinic-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clinic-system/artisan queue:work database --tries=3 --delay=5
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/clinic-system/storage/logs/worker.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
