services:
    app:
        build: .
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: clinic
            DB_USERNAME: clinic
            DB_PASSWORD: secret
            QUEUE_CONNECTION: database
            CACHE_STORE: file
            SESSION_DRIVER: file
            FILESYSTEM_DISK: local
        ports:
            - "8000:8000"
        volumes:
            - app_storage:/var/www/html/storage
        depends_on:
            - db

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: clinic
            MYSQL_USER: clinic
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db_data:/var/lib/mysql

volumes:
    app_storage:
    db_data:
